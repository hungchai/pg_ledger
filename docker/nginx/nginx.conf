worker_processes auto;
events {
    worker_connections 4096;
}
http {
    # Compose DNS re-resolved per request so `--scale api=N` changes take
    # effect without reloading nginx.
    resolver 127.0.0.11 valid=1s ipv6=off;

    upstream pgledger_api {
        zone pgledger_api 64k;
        least_conn;
        server api:8080 resolve;
        server api-2:8080 resolve;
        keepalive 256;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://pgledger_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }
    }
}
