pgledger_replay:
  query: |
    SELECT CASE
      WHEN pg_is_in_recovery() THEN COALESCE(EXTRACT(EPOCH FROM (clock_timestamp() - pg_last_xact_replay_timestamp())), 0)
      ELSE COALESCE((SELECT EXTRACT(EPOCH FROM MAX(replay_lag)) FROM pg_stat_replication), 0)
    END AS replay_lag_seconds
  metrics:
    - replay_lag_seconds:
        usage: "GAUGE"
        description: "Replica delay in seconds. Writer reports max replay_lag of connected standbys."

pgledger_rows:
  # reltuples (planner estimates) instead of count(*): exact counts require
  # full scans of multi-GB tables on every scrape and starve the workload.
  # autovacuum keeps the estimates fresh enough for monitoring.
  query: |
    SELECT 'accounts'::text AS rel, GREATEST(reltuples, 0)::float8 AS n FROM pg_class WHERE relname = 'pgledger_accounts'
    UNION ALL
    SELECT 'transfers'::text, GREATEST(reltuples, 0)::float8 FROM pg_class WHERE relname = 'pgledger_transfers'
    UNION ALL
    SELECT 'entries'::text, GREATEST(reltuples, 0)::float8 FROM pg_class WHERE relname = 'pgledger_entries'
  metrics:
    - rel:
        usage: "LABEL"
        description: "Ledger table"
    - n:
        usage: "GAUGE"
        description: "Estimated row count (reltuples)"
