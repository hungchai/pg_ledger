# Local dev only. Not for production.
# user: pgledger  password: pgledger  database: pgledger
# writer JDBC: jdbc:postgresql://localhost:5432/pgledger
# reader JDBC: jdbc:postgresql://localhost:5433/pgledger
# start: docker compose up -d
# stop:  docker compose down
# wipe volumes and re-run init: docker compose down -v
# max_connections=400 so 200 concurrent API calls each keep one session.

name: pgledger

services:
  writer:
    image: postgres:16
    container_name: pgledger-writer
    environment:
      POSTGRES_USER: pgledger
      POSTGRES_PASSWORD: pgledger
      POSTGRES_DB: pgledger
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - hot_standby=on
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=128MB
      - -c
      - max_connections=400
    ports:
      - "5432:5432"
    volumes:
      - writer_data:/var/lib/postgresql/data
      - ./db/V001__ledger.sql:/docker-entrypoint-initdb.d/V001__ledger.sql:ro
      - ./db/V002__functions.sql:/docker-entrypoint-initdb.d/V002__functions.sql:ro
      - ./docker/writer/zz-enable-replication.sh:/docker-entrypoint-initdb.d/zz-enable-replication.sh:ro
    shm_size: 512mb
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary server does not listen on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U pgledger -d pgledger && test -f /var/lib/postgresql/data/.replication-enabled"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  reader:
    image: postgres:16
    container_name: pgledger-reader
    environment:
      POSTGRES_USER: pgledger
      POSTGRES_PASSWORD: pgledger
      POSTGRES_DB: pgledger
      PRIMARY_HOST: writer
      PRIMARY_PORT: "5432"
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/reader-entrypoint.sh"]
    ports:
      - "5433:5432"
    volumes:
      - reader_data:/var/lib/postgresql/data
      - ./docker/reader/entrypoint.sh:/reader-entrypoint.sh:ro
    shm_size: 512mb
    depends_on:
      writer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U pgledger -d pgledger && test \"$$(psql -h 127.0.0.1 -p 5432 -U pgledger -d pgledger -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  writer_data:
  reader_data:
